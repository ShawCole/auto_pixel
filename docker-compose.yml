version: '3.8'

services:
  auto-pixel-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auto-pixel-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DB_HOST=34.31.66.104
      - DB_USER=root
      - DB_PASS=AccuPoint01!
      - TEMPLATE_DB=pixel
      - TEMPLATE_TABLE=pixel_data
      - AUDLAB_USERNAME=${AUDLAB_USERNAME}
      - AUDLAB_PASSWORD=${AUDLAB_PASSWORD}
      - DEBUG=
      - LOG_LEVEL=info
    volumes:
      - ./logs:/app/logs
      - ./backups:/app/backups
    networks:
      - auto-pixel-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:alpine
    container_name: auto-pixel-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - auto-pixel-backend
    networks:
      - auto-pixel-network

networks:
  auto-pixel-network:
    driver: bridge

volumes:
  logs:
  backups: 